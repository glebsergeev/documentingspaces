<!DOCTYPE html>
<html class="font-sans text-base antialiased" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gleb Sergeev | Photography</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles.css?v=1774889400" />
    <link rel="stylesheet" href="index-edit.css?v=1775004900" />
  </head>
  <body class="page-body" data-page="index">
    <div class="nav-root" x-data="{ navOpen: false }">
      <ul class="nav-bar">
        <li class="nav-site-stack">
          <a
            class="nav-trigger link-underline"
            href="#"
            role="button"
            :aria-expanded="navOpen"
            @click.prevent="navOpen = !navOpen; $nextTick(() => window.dispatchEvent(new CustomEvent('site-intro-layout')))"
            >Gleb Sergeev</a>
          <div x-show="navOpen" x-cloak class="nav-panel nav-panel--site-intro" id="siteIntroPanel">
            <p id="siteIntroText"></p>
          </div>
        </li>
        <li class="nav-external-links">
          <a id="navInstagram" class="link-underline" href="https://www.instagram.com/" target="_blank" rel="noreferrer noopener">Instagram</a><a id="navContact" class="link-underline" href="mailto:hello@example.com">Contact</a>
        </li>
      </ul>
    </div>

    <section class="carousel-section" x-data="carousel()" x-init="initSwiper()">
      <div class="carousel-section__inner">
        <button type="button" class="nav-hit nav-hit--prev" id="swiperPrev" aria-label="Previous"></button>
        <div class="swiper swiper-main" x-ref="swiper">
          <div class="swiper-wrapper"></div>
        </div>
        <button type="button" class="nav-hit nav-hit--next" id="swiperNext" aria-label="Next"></button>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="index-edit.js?v=1775004700"></script>
    <script src="app.js?v=1775004600"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  </body>
</html>
