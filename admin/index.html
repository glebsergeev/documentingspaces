<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects admin</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: color-mix(in srgb, CanvasText 18%, transparent);
        --muted: color-mix(in srgb, CanvasText 55%, Canvas);
        --focus: Highlight;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        margin: 0;
        padding: 1rem 1.25rem 3rem;
        max-width: 52rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      h2 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 1.75rem 0 0.65rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid var(--border);
      }
      a {
        color: inherit;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      .toolbar a {
        text-decoration: underline;
      }
      #status {
        margin: 0.5rem 0;
        font-size: 0.9rem;
        color: var(--muted);
      }
      #status.error {
        color: CanvasText;
        font-weight: 500;
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.75rem 1rem 1rem;
        margin: 0 0 1rem;
      }
      legend {
        padding: 0 0.35rem;
        font-weight: 500;
      }
      label.stack {
        display: block;
        margin-top: 0.65rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      label.stack:first-of-type {
        margin-top: 0;
      }
      input[type="text"],
      input[type="url"],
      input[type="email"],
      input[type="number"],
      textarea {
        display: block;
        width: 100%;
        max-width: 100%;
        margin-top: 0.2rem;
        padding: 0.4rem 0.5rem;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: Field;
        color: FieldText;
      }
      textarea {
        min-height: 4.5rem;
        resize: vertical;
      }
      input:focus,
      textarea:focus,
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        padding: 0.35rem 0.65rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.danger {
        border-color: color-mix(in srgb, #c00 40%, var(--border));
      }
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }
      .project-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.5rem 0.75rem;
        align-items: start;
        padding: 0.65rem 0;
        border-bottom: 1px solid var(--border);
      }
      .project-row:last-child {
        border-bottom: none;
      }
      .project-row-title {
        font-weight: 500;
      }
      .project-row-meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .check-inline {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      #editor-section {
        margin-top: 1.5rem;
      }
      #editor-section[hidden] {
        display: none !important;
      }
      .image-row {
        display: grid;
        grid-template-columns: 3rem 1fr auto;
        gap: 0.5rem;
        align-items: center;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--border);
      }
      .image-row:last-child {
        border-bottom: none;
      }
      .image-row img {
        width: 3rem;
        height: 3rem;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: color-mix(in srgb, CanvasText 6%, Canvas);
      }
      .image-row img[data-broken="1"] {
        visibility: hidden;
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.35rem;
      }
      .actions-bar {
        position: sticky;
        bottom: 0;
        margin-top: 2rem;
        padding: 0.75rem 0;
        background: Canvas;
        border-top: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      #import-json {
        font-size: 0.85rem;
        max-width: 14rem;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <h1>Projects admin</h1>
      <a href="../index.html">View site</a>
    </header>
    <p id="status" aria-live="polite"></p>

    <section aria-labelledby="site-heading">
      <h2 id="site-heading">Site</h2>
      <fieldset>
        <legend>Settings</legend>
        <div id="site-fields"></div>
      </fieldset>
    </section>

    <section aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <p class="hint">
        Order matches the public list. Use arrows to reorder. Visual gallery editor (horizontal, same as the site):
        <code>../project.html?slug=your-slug&amp;edit=1</code> (local server).
      </p>
      <div id="project-list"></div>
      <p style="margin-top: 0.75rem">
        <button type="button" id="add-project">New project</button>
      </p>
    </section>

    <section id="editor-section" aria-labelledby="editor-heading" hidden>
      <h2 id="editor-heading">Edit project</h2>
      <fieldset>
        <legend id="editor-legend">Details</legend>
        <div id="editor-body"></div>
      </fieldset>
    </section>

    <div class="actions-bar">
      <button type="button" id="download-json">Download projects.json</button>
      <label class="check-inline">
        <span>Import JSON</span>
        <input type="file" id="import-json" accept=".json,application/json" />
      </label>
      <span class="hint" style="margin: 0">Save replaces <code>data/projects.json</code> manually.</span>
    </div>

    <script src="admin.js" type="module"></script>
  </body>
</html>
